<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sudoku Día 6</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(9,45px);
  justify-content:center;
  margin-top:20px;
}

input{
  width:45px;
  height:45px;
  text-align:center;
  font-size:20px;
  border:1px solid #999;
  outline:none;
  background:white;
  color:black;
}

/* 🔥 líneas gruesas tipo sudoku real */
input:nth-child(3n){
  border-right:3px solid black;
}
input:nth-child(n+19):nth-child(-n+27),
input:nth-child(n+46):nth-child(-n+54){
  border-bottom:3px solid black;
}
input:nth-child(-n+9){
  border-top:3px solid black;
}
input:nth-child(9n+1){
  border-left:3px solid black;
}

.fixed{
  background:#e5e5e5;
  font-weight:bold;
}

button{
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
  cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<h2>🧩 Día 6</h2>
<p>Esta facil jdajdjas(No pude poner las lineas verticales gruesas)</p>

<div id="grid" class="grid"></div>

<button onclick="check()">Verificar</button>

<div id="win" class="hidden">
  <h2>💖</h2>
  <p><b>me importás mucho y me encantaria que esto que tenemos siga creciendo</b></p>
</div>

<script>

let base = [
[5,3,4,6,7,8,9,1,2],
[6,7,2,1,9,5,3,4,8],
[1,9,8,3,4,2,5,6,7],
[8,5,9,7,6,1,4,2,3],
[4,2,6,8,5,3,7,9,1],
[7,1,3,9,2,4,8,5,6],
[9,6,1,5,3,7,2,8,4],
[2,8,7,4,1,9,6,3,5],
[3,4,5,2,8,6,1,7,9]
];


function shuffleNumbers(grid){
 let map = [1,2,3,4,5,6,7,8,9];
 map.sort(()=>Math.random()-0.5);

 return grid.map(row => row.map(n => map[n-1]));
}


function createPuzzle(grid){
 let puzzle = grid.map(row => [...row]);

 for(let i=0;i<50;i++){ 
  let x = Math.floor(Math.random()*9);
  let y = Math.floor(Math.random()*9);
  puzzle[x][y] = 0;
 }

 return puzzle;
}

let solution = shuffleNumbers(base);
let puzzle = createPuzzle(solution);

function draw(){
 const gridEl = document.getElementById('grid');
 gridEl.innerHTML='';

 for(let i=0;i<9;i++){
  for(let j=0;j<9;j++){
   const input = document.createElement('input');

   if(puzzle[i][j] !== 0){
    input.value = puzzle[i][j];
    input.disabled = true;
    input.classList.add('fixed');
   }

   input.id = `c-${i}-${j}`;

   input.oninput = function(){
    this.value = this.value.replace(/[^1-9]/g,'');
   }

   gridEl.appendChild(input);
  }
 }
}

function check(){
 for(let i=0;i<9;i++){
  for(let j=0;j<9;j++){
   let val = document.getElementById(`c-${i}-${j}`).value;
   if(Number(val) !== solution[i][j]){
    alert("Falta algo");
    return;
   }
  }
 }
 document.getElementById('win').classList.remove('hidden');
}

draw();
</script>

</body>
</html>
