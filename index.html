<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Día 6 - Sudoku</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(9,40px);
  justify-content:center;
  margin-top:20px;
}

input{
  width:40px;
  height:40px;
  text-align:center;
  font-size:18px;
  border:1px solid #475569;
  outline:none;
  background:#1e293b;
  color:white;
}

.fixed{
  background:#334155;
  font-weight:bold;
}

/* 🔥 Bordes grandes cada 3x3 */
.border-right{
  border-right:3px solid white !important;
}
.border-bottom{
  border-bottom:3px solid white !important;
}
.border-left{
  border-left:3px solid white !important;
}
.border-top{
  border-top:3px solid white !important;
}

button{
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#334155;
  color:white;
  cursor:pointer;
}

.hidden{display:none;}
</style>

</head>

<body>

<h2>Sudoku</h2>
<p>YO SE QUE PODES</p>

<div id="grid" class="grid"></div>

<button onclick="checkSudoku()">Verificar</button>

<div id="win" class="hidden">
  <h2>💖</h2>
  <p><b>Me importas mucho y</b></p>
</div>

<script>
const puzzle = [
[5,3,0,0,7,0,0,0,0],
[6,0,0,1,9,5,0,0,0],
[0,9,8,0,0,0,0,6,0],
[8,0,0,0,6,0,0,0,3],
[4,0,0,8,0,3,0,0,1],
[7,0,0,0,2,0,0,0,6],
[0,6,0,0,0,0,2,8,0],
[0,0,0,4,1,9,0,0,5],
[0,0,0,0,8,0,0,7,9]
];

const solution = [
[5,3,4,6,7,8,9,1,2],
[6,7,2,1,9,5,3,4,8],
[1,9,8,3,4,2,5,6,7],
[8,5,9,7,6,1,4,2,3],
[4,2,6,8,5,3,7,9,1],
[7,1,3,9,2,4,8,5,6],
[9,6,1,5,3,7,2,8,4],
[2,8,7,4,1,9,6,3,5],
[3,4,5,2,8,6,1,7,9]
];

function draw(){
 const grid = document.getElementById('grid');
 grid.innerHTML = '';

 for(let i=0;i<9;i++){
  for(let j=0;j<9;j++){
   const input = document.createElement('input');

   if(puzzle[i][j] !== 0){
    input.value = puzzle[i][j];
    input.disabled = true;
    input.classList.add('fixed');
   }

   // 🔥 bordes cada 3
   if(j % 3 === 2 && j !== 8) input.classList.add('border-right');
   if(i % 3 === 2 && i !== 8) input.classList.add('border-bottom');
   if(j === 0) input.classList.add('border-left');
   if(i === 0) input.classList.add('border-top');

   input.id = "c-"+i+"-"+j;

   input.oninput = function(){
     this.value = this.value.replace(/[^1-9]/g,'');
   }

   grid.appendChild(input);
  }
 }
}

function checkSudoku(){
 for(let i=0;i<9;i++){
  for(let j=0;j<9;j++){
   const val = document.getElementById("c-"+i+"-"+j).value;

   if(Number(val) !== solution[i][j]){
     alert("Segui intentando");
     return;
   }
  }
 }

 document.getElementById('win').classList.remove('hidden');
}

draw();
</script>

</body>
</html>
